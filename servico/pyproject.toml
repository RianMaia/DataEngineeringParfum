[project]
name = "rotaperfume-servico"
version = "0.1.0"
description = "Camada de serviço (FastAPI + PostgreSQL) do DataEngineeringParfum"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",  # framework da API: rotas, validação de entrada e documentação automática (/docs)
    "uvicorn",  # servidor que executa a aplicação FastAPI
]

[dependency-groups]
# Só para desenvolvimento e testes. Não entram na imagem Docker de produção.
dev = [
    "pytest",  # executa os testes automatizados
    "httpx2",  # cliente HTTP usado pelo TestClient do FastAPI para chamar a API nos testes
    "ruff",    # verifica estilo e erros comuns, e formata o código
]

[tool.uv]
package = false                        # é uma aplicação, não uma biblioteca instalável
exclude-newer = "2026-10-07T00:00:00Z" # ignora pacotes publicados nos últimos 14 dias (até 21/10/2026)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permite "from app.main import app" nos testes

[tool.ruff]
line-length = 120
